const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const seg = (t, a, b) => smooth((t - a) / (b - a));
const segE = (t, a, b) => ease((t - a) / (b - a));
const segO = (t, a, b) => out((t - a) / (b - a));

];

const ring = h('div', 'hubring', stage);
const hubTxt = [...hub.querySelectorAll('.hubt1, .hubt2')];

// ---------------------------------------------------------------- act 2: the browser window with the demo hub
const WX = 140, WY = 196, WW = 1640, WH = 850;
const win = h('div', 'win', stage);
win.innerHTML = `<div class="chrome"><i></i><i></i><i></i><div class="url">demo.sanfordoperations.com</div></div>
<div class="nav"><div class="logo"><b></b>Bluestem <span>Hub</span></div>
 <div class="tabs"><span data-p="home">Home</span><span data-p="score">Scorecard</span><span>Pipeline</span><span>Receivables</span><span data-p="alerts">Alerts</span><span data-p="agents">AI agents</span></div>

home.innerHTML = `<div class="ptitle">Where we stand</div><div class="psub">Year to date, compared with the same dates last year</div>`;
const TILES = [['Bookings this year', 20.0, v => '$' + v.toFixed(1) + 'M', '▲ 5.6% vs last year', 'up'], ['Win rate (by $)', 34.5, v => v.toFixed(1) + '%', '▲ 0.4 pts vs last year', 'up'],
  ['Open pipeline', 18.9, v => '$' + v.toFixed(1) + 'M', '207 deals closing this year', ''], ['Billed this year', 18.9, v => '$' + v.toFixed(1) + 'M', '▼ 4.3% vs last year', 'down'],
  ['Cash collected', 18.2, v => '$' + v.toFixed(1) + 'M', '▼ 2.4% vs last year', 'down'], ['Over 60 days late', 454, v => '$' + Math.round(v) + 'K', 'of $3.3M unpaid', '']];
const tilesRow = h('div', 'tiles', home);
const tiles = TILES.map(([l, v, f, d, c]) => { const e = h('div', 'tile card', tilesRow, `<div class="tl">${l}</div><div class="tv"></div><div class="td ${c}">${d}</div>`); return { e, v, f, num: e.querySelector('.tv') }; });
const grid2 = h('div', 'grid2', home);
const chart = h('div', 'card chart', grid2, `<div class="ch"><b>Bookings by month</b><span class="lg"><i class="b26"></i>2026 <i class="b25"></i>2025</span></div><div class="bars"></div>`);
const B26 = [0.85, 1.7, 1.6, 1.9, 2.7, 2.15, 1.5, 3.0, 3.3, 1.25], B25 = [1.9, 0.8, 2.05, 1.0, 1.8, 2.35, 4.05, 1.65, 2.2, 1.85, 2.5, 2.35];
const MON = 'JFMAMJJASOND'.split('');

MON.forEach((m, i) => { const g = h('div', 'bg', barsEl, `<div class="pair"></div><div class="mo">${m}</div>`); const pair = g.querySelector('.pair');

  ['Bookings (won)', '≥ $500K', [824, 486, 970, 717, 761, 561, 668, 664], v => v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'M' : '$' + v + 'K', v => v >= 500],
  ['Win rate by $, 90 days', '≥ 36.0%', [32.4, 31.9, 31.3, 32.9, 33.7, 33.0, 35.6, 36.1], v => v.toFixed(1) + '%', v => v >= 36],

const hdr = h('div', 'scrow schead', table, `<div class="scm">Measure</div>${WEEKS.map(w => `<div class="scc">${w}</div>`).join('')}<div class="scg">On goal</div>`);

 <div class="cmp"><div class="cr"><span>This month so far</span><div class="cb now"></div><b>$243K</b></div><div class="cr"><span>Same date last year</span><div class="cb then"></div><b>$299K</b></div></div>

const AL = [['Billing behind pace', 'Fort Worth is at 81% of last year’s billing for the month so far', '$243K vs $299K', 'Oct 18'],
  ['Deal slipped', 'Westlake Corporate Campus - Rooftop unit replacement moved to Nov 13', '$391K', 'Oct 14'],
  ['Big loss', 'Lost: Cypress Bend Prep School - Rooftop unit replacement', '$192K', 'Oct 12'],
  ['Deal slipped', 'Blanco Valley Community College - Tenant fit-out MEP moved to Dec 8', '$185K', 'Oct 17'],
  ['Big loss', 'Lost: Mesquite Creek Academy - Generator maintenance agreement', '$154K', 'Oct 16']];
const alist = h('div', 'card alist', alerts);
const arows = AL.map(([k, d, a, dt]) => h('div', 'arow', alist, `<div class="bang">!</div><div class="ak"><div class="akind">${k}</div><div>${d}</div></div><div class="amt">${a}</div><div class="muted adt">${dt}</div>`));
const phone = h('div', 'phone', stage, `<div class="notch"></div><div class="ptime">9:41</div><div class="pdate">Wednesday, October 14</div>
 <div class="notif"><div class="nh"><b class="nlogo"></b>BLUESTEM HUB<span>now</span></div><div class="nt">Deal slipped: Westlake Corporate Campus</div><div class="nb">Rooftop unit replacement moved to Nov 13 · $391K. Tap to see the deal.</div></div>`);
const notif = phone.querySelector('.notif');

// --- AI agents
const agents = h('div', 'page', body);
agents.innerHTML = `<div class="ptitle">AI agents</div><div class="psub">What the AI agents prepared this morning</div>`;
const ag = h('div', 'grid2 ag', agents);
const brief = h('div', 'card brief', ag, `<div class="ch"><b>Daily brief</b><span class="muted">For the COO · prepared 6:30 AM</span></div>`);
const BRIEF = ['51 deals are due to close in the next 7 days, $4.6M in total.', '73 invoices are more than 60 days late, $454K in total. Reminders for the largest are drafted.',
  '8 open deals were pushed to a later month this week ($808K).', 'Fort Worth is at 81% of last year’s billing for the month so far.'];
const blines = BRIEF.map(s => { const e = h('div', 'bl', brief, `<span class="bt"></span>`); return { e, s, t: e.querySelector('.bt') }; });
const appr = h('div', 'card appr', ag, `<div class="ch"><b>Waiting for approval</b><span class="muted">3 payment reminders</span></div>
 <div class="mail"><div class="mh">Invoice 005362: a friendly reminder</div><div class="muted sm">To Riverbend Health Partners · Austin · $28K, 79 days late</div><div class="mbody"></div>
 <div class="btns"><span class="approve">Approve and send</span><span class="copy">Copy text</span></div><div class="done">✓ Approved and sent</div></div>`);
const MAIL = 'Hi Riverbend Health Partners team,\n\nOur records show invoice 005362 for $28K is now 79 days past its due date.\n\nIf it’s already on its way, thank you, and please ignore this note. If anything needs sorting out, just reply and we’ll take care of it.\n\nThank you,\nBluestem Facility Services accounts';
const mbody = appr.querySelector('.mbody'), approveBtn = appr.querySelector('.approve'), done = appr.querySelector('.done'), mail = appr.querySelector('.mail');

// ---------------------------------------------------------------- cursor
const cursor = h('div', 'cursor', stage, `<svg width="34" height="40" viewBox="0 0 34 40"><path d="M3 2 L3 31 L10.5 24.5 L15.5 36 L21 33.6 L16 22.4 L26 22.4 Z" fill="#1d1d1f" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>`);
const click = h('div', 'click', stage);
// [time, x, y] in screen pixels; clicks at the listed times
const tabX = i => tabs[i].offsetLeft + tabs[i].offsetWidth / 2;
let CUR = [], CLICKS = [];

// ---------------------------------------------------------------- end and title cards
const veil = h('div', 'veil', stage);
const endc = h('div', 'card-end', stage, `<img src="SEAL_OX" alt="" width="200" height="200"><div class="e1">Your data in one place.</div><div class="e1">Numbers everyone trusts, put to work.</div><div class="e2">sanfordoperations.com</div>`);

function curAt(t) { if (t <= CUR[0][0]) return CUR[0].slice(1); for (let i = 0; i < CUR.length - 1; i++) { const [t0, x0, y0] = CUR[i], [t1, x1, y1] = CUR[i + 1]; if (t <= t1) { const k = ease((t - t0) / (t1 - t0)); return [lerp(x0, x1, k), lerp(y0, y1, k)]; } } return CUR[CUR.length - 1].slice(1); }

function renderAt(t) {
  t = clamp(t, 0, T);
  caps.forEach(c => { const o = fade(t, c.a - 0.5, c.a, c.b - 0.5, c.b); css(c.e, o, `translateY(${(1 - o) * 14}px)`); });

  // act 1: scattered systems drift, then fly into the hub
  const hubIn = segO(t, 7.2, 8.0), hubOut = seg(t, 12.0, 12.8);
  sys.forEach(s => { const app = seg(t, 0.3 + s.i * 0.12, 0.9 + s.i * 0.12); const t1 = 8.0 + s.i * 0.16, k = segE(t, t1, t1 + 1.0);
    const dx = 10 * Math.sin(t * 0.7 + s.i), dy = 8 * Math.cos(t * 0.6 + s.i * 1.7);
    const tx = (HX - (s.x + 170)) * k, ty = (HY - 53 - (s.y + 48)) * k;
    css(s.e, app * (1 - seg(t, t1 + 0.4, t1 + 0.8)), `translate(${dx * (1 - k) + tx}px,${dy * (1 - k) + ty}px) rotate(${s.r * (1 - k)}deg) scale(${1 - 0.75 * k})`); });
  const pulse = Math.max(...sys.map(s => { const a = 8.85 + s.i * 0.16; return t > a ? Math.max(0, 1 - (t - a) / 0.5) : 0; }));
  css(hub, hubIn * (1 - hubOut), `translate(-50%,-50%) scale(${(0.85 + 0.15 * hubIn) * (1 + 0.03 * pulse) * (1 - 0.3 * hubOut)})`);
  hubTxt.forEach((e, i) => css(e, seg(t, 9.8 + i * 0.2, 10.3 + i * 0.2), `translateY(${(1 - seg(t, 9.8 + i * 0.2, 10.4 + i * 0.2)) * 10}px)`));
  const rk = ((t - 10.2) % 1.4 + 1.4) % 1.4 / 1.4; css(ring, t > 10.2 && t < 12.2 ? (1 - rk) * 0.5 * hubIn : 0, `translate(-50%,-50%) scale(${1 + rk * 0.7})`);

  // the window grows out of the hub, and shrinks away at the end
  const wIn = segE(t, 12.1, 13.6), wOut = segE(t, 53.8, 55.0);
  const ws = lerp(0.1, 1, wIn) * lerp(1, 0.86, wOut), wcx = lerp(HX, WX + WW / 2, wIn), wcy = lerp(HY, WY + WH / 2, wIn);
  css(win, seg(t, 12.1, 12.6) * (1 - seg(t, 54.2, 55.0)), `translate(${wcx - (WX + WW / 2)}px,${wcy - (WY + WH / 2)}px) scale(${ws})`);
  css(note, fade(t, 14.0, 14.6, 21.5, 22.2));

  // which page is showing
  const P = t < 22.9 ? 'home' : t < 38.5 ? 'score' : t < 44.7 ? 'alerts' : 'agents';
  tabs.forEach(s => s.classList.toggle('on', s.dataset.p === P));
  css(home, P === 'home' ? 1 : 0); css(score, P === 'score' ? seg(t, 22.9, 23.2) : 0); css(alerts, P === 'alerts' ? seg(t, 38.5, 38.8) : 0); css(agents, P === 'agents' ? seg(t, 44.7, 45.0) : 0);

  // home: tiles count up, bars grow, the week's list slides in
  tiles.forEach((o, i) => { const a = 14.9 + i * 0.14, k = segO(t, a, a + 1.3); css(o.e, seg(t, a - 0.2, a + 0.2), `translateY(${(1 - seg(t, a - 0.2, a + 0.3)) * 16}px)`); o.num.textContent = o.f(o.v * k); });

  css(last7, seg(t, 16.0, 16.4)); l7.forEach((e, i) => { const a = 16.7 + i * 0.22; css(e, seg(t, a, a + 0.35), `translateX(${(1 - segO(t, a, a + 0.4)) * 24}px)`); });

  // scorecard: fills in week by week

  const nk = segO(t, 41.6, 42.1); css(notif, nk, `translateY(${(1 - nk) * -30}px) scale(${0.94 + 0.06 * nk})`);
