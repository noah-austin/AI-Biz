# Bluestem Facility Services: a FICTIONAL company used to demo the kit.
# Every client gets a folder like this one. It holds their business settings;
# secrets never go here (they go in the server's .env).

company = "Bluestem Facility Services"
short_name = "Bluestem"
timezone = "America/Chicago"
demo = true
demo_guest = true          # the website's "See a live demo" button signs visitors in as a read-only guest
demo_by = "Sanford Operations"
demo_by_url = "https://sanfordoperations.com"
demo_cta_url = "https://sanfordoperations.com/contact?interest=demo"
fiscal_year_start_month = 1

# Where "open in source system" links go. In the demo they open a stand-in page.
[links]
crm_deal = "/demo-source/crm/opportunity/{id}"
crm_account = "/demo-source/crm/account/{id}"
accounting_invoice = "/demo-source/accounting/invoice/{id}"
accounting_customer = "/demo-source/accounting/customer/{id}"

# AI layer. Each feature has its own API key (in .env), its own monthly cap and a usage log.
[ai]
model = "claude-opus-5-5"
chat_effort = "medium"
insights_effort = "high"
chat_monthly_cap_usd = 50
insights_monthly_cap_usd = 25
questions_per_user_per_day = 40
insights_per_day = 3

[[sources]]
type = "demo_crm"
path = "source"

[[sources]]
type = "demo_accounting"
path = "source"

# CRM branch codes -> the names people use, and which region each rolls up to.
[[branches]]
code = "DAL-01"
name = "Dallas"
region = "North Texas"
[[branches]]
code = "FTW-02"
name = "Fort Worth"
region = "North Texas"
[[branches]]
code = "AUS-03"
name = "Austin"
region = "Central Texas"
[[branches]]
code = "SAT-04"
name = "San Antonio"
region = "Central Texas"
[[branches]]
code = "HOU-05"
name = "Houston"
region = "Gulf Coast"
[[branches]]
code = "HOU-06"
name = "Houston South"
region = "Gulf Coast"

# Goals. period is a year ("2026") or "weekly".
[[goals]]
