# Kestrel Ridge Engineering: a FICTIONAL engineering and consulting firm used to demo the kit. Data from generate.py.

company = "Kestrel Ridge Engineering"
short_name = "Kestrel Ridge"
timezone = "America/Chicago"
demo = true
demo_guest = true
demo_by = "Sanford Operations"
demo_by_url = "https://sanfordoperations.com"
demo_cta_url = "https://sanfordoperations.com/contact?interest=demo"
demo_more_url = "https://sanfordoperations.com/demo"
embed_from = ["https://sanfordoperations.com"]   # the website shows this demo inside its pages
demo_intro = "A fictional engineering and consulting firm: four Texas offices, about 100 people, two years of projects and time."
fiscal_year_start_month = 1
apps = ["analytics", "projects", "people"]

[links]
crm_deal = "/demo-source/crm/opportunity/{id}"
crm_account = "/demo-source/crm/account/{id}"
accounting_invoice = "/demo-source/accounting/invoice/{id}"
accounting_customer = "/demo-source/accounting/customer/{id}"
psa_project = "/demo-source/projects/project/{id}"
hr_employee = "/demo-source/hr/employee/{id}"

[ai]
chat = true
model = "claude-opus-5-5"
chat_monthly_cap_usd = 25
insights_monthly_cap_usd = 0
insights_per_day = 0

[[sources]]
type = "demo_crm"
path = "source"
[[sources]]
type = "demo_accounting"
path = "source"
[[sources]]
type = "demo_projects"
path = "source"
[[sources]]
type = "demo_hr"
path = "source"

[[branches]]
code = "HOU"
name = "Houston"
region = "Gulf Coast"
[[branches]]
code = "DFW"
name = "Dallas"
region = "North Texas"
[[branches]]
code = "AUS"
name = "Austin"
region = "Central Texas"
[[branches]]
code = "SAT"
name = "San Antonio"
region = "Central Texas"

[people]
frontline_department = "Engineering"
frontline_label = "engineers"
license = "Professional Engineer (PE) license"

[[tour]]
href = "/projects"
title = "Projects"
text = "Utilization by office, realization by project manager, and the projects burning budget too fast."
[[tour]]
href = "/scorecard"
title = "Scorecard"
text = "The weekly numbers, filled in automatically. Green means the goal was hit."
[[tour]]
href = "#"
title = "Click any number"
text = "Every tile, bar and row opens the records behind it, down to the project."
[[tour]]
href = "/agent-work"
title = "AI agents"
text = "This morning's brief: the office with spare capacity, the projects over budget and the time nobody billed."

