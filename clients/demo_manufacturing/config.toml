# Cottonwood Precision Manufacturing: a FICTIONAL contract manufacturer used to demo the kit. Data from generate.py.

company = "Cottonwood Precision Manufacturing"
short_name = "Cottonwood"
timezone = "America/Chicago"
demo = true
demo_guest = true
demo_by = "Sanford Operations"
demo_by_url = "https://sanfordoperations.com"
demo_cta_url = "https://sanfordoperations.com/contact?interest=demo"
demo_more_url = "https://sanfordoperations.com/demo"
demo_intro = "A fictional contract manufacturer: two Texas plants, seven work centers, two years of orders, production and crews."
fiscal_year_start_month = 1
apps = ["analytics", "production", "orders", "inventory", "purchasing", "people"]

[links]
crm_deal = "/demo-source/crm/opportunity/{id}"
crm_account = "/demo-source/crm/account/{id}"
accounting_invoice = "/demo-source/accounting/invoice/{id}"
accounting_customer = "/demo-source/accounting/customer/{id}"
mfg_order = "/demo-source/production/mo/{id}"
ord_order = "/demo-source/orders/order/{id}"
inv_item = "/demo-source/inventory/item/{id}"
ap_po = "/demo-source/purchasing/po/{id}"
hr_employee = "/demo-source/hr/employee/{id}"

[ai]
chat = true
model = "claude-opus-5-5"
chat_monthly_cap_usd = 25
insights_monthly_cap_usd = 0
insights_per_day = 0

[[sources]]
type = "demo_crm"
path = "source"
[[sources]]
type = "demo_accounting"
path = "source"
[[sources]]
type = "demo_orders"
path = "source"
[[sources]]
type = "demo_production"
path = "source"
[[sources]]
type = "demo_inventory"
path = "source"
[[sources]]
type = "demo_purchasing"
path = "source"
[[sources]]
type = "demo_hr"
path = "source"

[[branches]]
code = "FTW"
name = "Fort Worth"
region = "North Texas"
[[branches]]
code = "WAC"
name = "Waco"
region = "Central Texas"

[people]
frontline_department = "Production"
frontline_label = "production staff"
license = "AWS certified welder (D1.1)"

