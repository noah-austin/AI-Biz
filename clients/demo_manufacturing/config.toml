[[tour]]
href = "/production"
title = "Production"
text = "Effectiveness by work center, downtime by reason and scrap. One machine is costing far more than the rest."
[[tour]]
href = "/orders"
title = "Orders"
text = "What customers get on time, and the margin on steel-heavy products as steel prices rise."
[[tour]]
href = "#"
title = "Click any number"
text = "Every tile, bar and row opens the records behind it, down to the production order."
[[tour]]
href = "/agent-work"
title = "AI agents"
text = "This morning's brief: the weakest machine, the scrap spike and the orders running late."

# Alert thresholds. Many small invoices, so only bigger ones raise a late-payment alert.
[watch]
late_min = 10000
