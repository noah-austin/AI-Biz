# Mesquite Ridge Constructors: a FICTIONAL commercial general contractor used to demo the kit. Data from generate.py.

company = "Mesquite Ridge Constructors"
short_name = "Mesquite Ridge"
timezone = "America/Chicago"
demo = true
demo_guest = true
demo_by = "Sanford Operations"
demo_by_url = "https://sanfordoperations.com"
demo_cta_url = "https://sanfordoperations.com/contact?interest=demo"
demo_more_url = "https://sanfordoperations.com/demo"
demo_intro = "A fictional commercial general contractor: three Texas offices, about $90M a year, two years of jobs, costs and crews."
fiscal_year_start_month = 1
apps = ["analytics", "job_cost", "purchasing", "people"]

[links]
crm_deal = "/demo-source/crm/opportunity/{id}"
crm_account = "/demo-source/crm/account/{id}"
accounting_invoice = "/demo-source/accounting/invoice/{id}"
accounting_customer = "/demo-source/accounting/customer/{id}"
jc_job = "/demo-source/jobcost/job/{id}"
ap_po = "/demo-source/purchasing/po/{id}"
hr_employee = "/demo-source/hr/employee/{id}"

[ai]
chat = true
model = "claude-opus-5-5"
chat_monthly_cap_usd = 25
insights_monthly_cap_usd = 0
insights_per_day = 0

[[sources]]
type = "demo_crm"
path = "source"
[[sources]]
type = "demo_accounting"
path = "source"
[[sources]]
type = "demo_job_cost"
path = "source"
[[sources]]
type = "demo_purchasing"
path = "source"
[[sources]]
type = "demo_hr"
path = "source"

[[branches]]
code = "HOU"
name = "Houston"
region = "Gulf Coast"
[[branches]]
code = "SAT"
name = "San Antonio"
region = "Central Texas"
[[branches]]
code = "AUS"
name = "Austin"
region = "Central Texas"

[people]
frontline_department = "Field Operations"
frontline_label = "field crew"
license = "NCCCO crane operator certification"

[[tour]]
href = "/job-cost"
title = "Job cost"
text = "The work-in-progress report, every morning: margin fade, over and under billing, change orders waiting."
[[tour]]
href = "/scorecard"
title = "Scorecard"
text = "The weekly numbers, filled in automatically. Green means the goal was hit."
[[tour]]
href = "#"
title = "Click any number"
text = "Every tile, bar and row opens the records behind it, down to the job and its pay applications."
[[tour]]
href = "/agent-work"
title = "AI agents"
text = "This morning's brief: the job that's losing money, the one nobody's billing and the change orders stuck with owners."

# Goals. period is a year or "weekly".
[[goals]]
metric = "bookings"
period = "2026"
value = 95000000
[[goals]]
metric = "bookings"
period = "weekly"
value = 1800000
[[goals]]
metric = "new_pipeline"
period = "weekly"
value = 6000000
[[goals]]
metric = "new_deals"
period = "weekly"
value = 4
[[goals]]
metric = "billed_4wk"
period = "weekly"
value = 7200000
[[goals]]
metric = "collected"
period = "weekly"
value = 1600000
[[goals]]
metric = "ar_over_60"
period = "weekly"
value = 3200000
[[goals]]
metric = "win_rate_dollars"
period = "weekly"
value = 30
[[goals]]
metric = "overtime_pct"
period = "weekly"
value = 12

# Alert thresholds. Pay applications go out once a month, so a mid-month billing-pace check doesn't apply.
[watch]
billing_pace = 0
late_min = 25000
