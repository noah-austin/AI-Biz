# Bramblewood Industrial Supply: a FICTIONAL distributor used to demo the kit. Data from generate.py.

company = "Bramblewood Industrial Supply"
short_name = "Bramblewood"
timezone = "America/Chicago"
demo = true
demo_guest = true
demo_by = "Sanford Operations"
demo_by_url = "https://sanfordoperations.com"
demo_cta_url = "https://sanfordoperations.com/contact?interest=demo"
demo_more_url = "https://sanfordoperations.com/demo"
embed_from = ["https://sanfordoperations.com"]   # the website shows this demo inside its pages
fiscal_year_start_month = 1
demo_intro = "A fictional industrial supply distributor: six Texas branches, two years of orders, stock and staff."
apps = ["analytics", "orders", "inventory", "purchasing", "people"]

[links]
crm_deal = "/demo-source/crm/opportunity/{id}"
crm_account = "/demo-source/crm/account/{id}"
accounting_invoice = "/demo-source/accounting/invoice/{id}"
accounting_customer = "/demo-source/accounting/customer/{id}"
ord_order = "/demo-source/orders/order/{id}"
inv_item = "/demo-source/inventory/item/{id}"
ap_po = "/demo-source/purchasing/po/{id}"
hr_employee = "/demo-source/hr/employee/{id}"

[ai]
chat = true
model = "claude-opus-5-5"
chat_effort = "medium"
insights_effort = "high"
chat_monthly_cap_usd = 25
insights_monthly_cap_usd = 0
questions_per_user_per_day = 40
insights_per_day = 0

[[sources]]
type = "demo_crm"
path = "source"
[[sources]]
type = "demo_accounting"
path = "source"
[[sources]]
type = "demo_orders"
path = "source"
[[sources]]
type = "demo_inventory"
path = "source"
[[sources]]
type = "demo_purchasing"
path = "source"
[[sources]]
type = "demo_hr"
path = "source"

[[branches]]
code = "HOU-01"
name = "Houston"
region = "Gulf Coast"
[[branches]]
code = "BMT-06"
name = "Beaumont"
region = "Gulf Coast"
[[branches]]
code = "DAL-02"
name = "Dallas"
region = "North & Central"
[[branches]]
code = "AUS-04"
name = "Austin"
region = "North & Central"
[[branches]]
code = "SAT-03"
name = "San Antonio"
region = "South Texas"
[[branches]]
code = "CRP-05"
name = "Corpus Christi"
region = "South Texas"

[people]
frontline_department = "Warehouse & Delivery"
frontline_label = "warehouse and delivery staff"
license = "Commercial driver's license (CDL B)"

# Goals. period is a year or "weekly".
[[goals]]
metric = "bookings"
period = "2026"
value = 22000000
[[goals]]
metric = "bookings"
period = "weekly"
value = 400000
[[goals]]
metric = "new_pipeline"
period = "weekly"
value = 1200000
[[goals]]
metric = "new_deals"
period = "weekly"
value = 20
[[goals]]
metric = "billed_4wk"
period = "weekly"
value = 3400000
[[goals]]
metric = "collected"
period = "weekly"
value = 750000
[[goals]]
metric = "ar_over_60"
period = "weekly"
value = 1000000
[[goals]]
metric = "win_rate_dollars"
period = "weekly"
value = 35
[[goals]]
metric = "overtime_pct"
period = "weekly"
value = 8
[[goals]]
metric = "fill_rate"
period = "weekly"
value = 94
[[goals]]
metric = "on_time_ship"
period = "weekly"
value = 85
[[goals]]
metric = "gross_margin"
period = "weekly"
value = 24

# Bramblewood bills from shipped orders, not from CRM deals, so "won deal with no invoice" doesn't apply.
[checks]
skip = ["won_not_billed"]

# The guest's "Welcome to the demo" card.
[[tour]]
href = "/orders"
title = "Orders"
text = "Fill rate, shipping on time and margin by product line. One branch is running out of stock; spot which."
[[tour]]
href = "/scorecard"
title = "Scorecard"
text = "The weekly numbers, filled in automatically. Green means the goal was hit."
[[tour]]
href = "#"
title = "Click any number"
text = "Every tile, bar and row opens the records behind it, down to the order."
[[tour]]
href = "/agent-work"
title = "AI agents"
text = "This morning's brief: the margin that's slipping, the stock-outs and who's paying late."

# Alert thresholds. Many small invoices, so only bigger ones raise a late-payment alert.
[watch]
late_min = 5000
