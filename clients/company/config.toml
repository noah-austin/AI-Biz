# Our own company hub: the practice tracker (prospects, clients, time, money) plus Ask AI.
# Rename `company` and `short_name` once the business has a name.

company = "Noah's consulting practice"
short_name = "Practice"
timezone = "America/Chicago"
apps = ["practice"]

[practice]
revenue_goal = 90000            # year-one target ("Steady" scenario in docs/concept.md)
weekly_hours_target = 20
monthly_conversations_target = 15
invoice_terms_days = 15

[ai]
model = "claude-opus-5-5"
chat_effort = "medium"
insights_effort = "high"
chat_monthly_cap_usd = 20
insights_monthly_cap_usd = 0
questions_per_user_per_day = 40
insights_per_day = 0
