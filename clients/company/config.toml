# Our own company hub: the practice tracker (prospects, clients, time, money) plus Ask AI.

company = "Sanford Operations"
short_name = "Sanford Ops"
timezone = "America/Chicago"
apps = ["practice"]

[practice]
revenue_goal = 100000           # revenue within the first 12 months
goal_start = 2026-10-01
goal_end = 2027-09-30
weekly_hours_target = 20
monthly_conversations_target = 15
invoice_terms_days = 15
referral_fee_pct = 10           # of a referred client's invoices in their first 12 months

# Weekly targets for Noah's own scorecard (from sales/targets.md)
[practice.weekly_targets]
outreach = 25                   # emails + LinkedIn messages logged
new_prospects = 25
conversations = 4
proposals = 1

# Who the business development agent looks for.
[agents]   # spending cap is agents_monthly_cap_usd under [ai]
prospects_per_run = 10
ideal_client = """Small and mid-size US companies (roughly 20-1,000 employees, $5M-$500M revenue) in any industry, that run on several systems (a CRM, accounting, ERP, project or field-service tools, HR, spreadsheets) and have no data team. Best signals: multiple locations or divisions, recent growth or acquisitions, a COO/CFO/VP Operations, job posts for reporting or BI analysts, a recent CRM or ERP rollout, lots of spreadsheets. Best contact: the COO, CFO, VP Operations, president or owner."""

[ai]
model = "claude-opus-5-5"
chat_effort = "medium"
insights_effort = "high"
chat_monthly_cap_usd = 20
agents_monthly_cap_usd = 60
insights_monthly_cap_usd = 0
questions_per_user_per_day = 40
insights_per_day = 0
